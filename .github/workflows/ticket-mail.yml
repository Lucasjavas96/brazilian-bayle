name: Ticket transactional emails
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticket-transactional-mail
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deliver queued transactional emails
        env:
          BRB_TICKET_WORKER_TOKEN: ${{ secrets.BRB_TICKET_WORKER_TOKEN }}
        run: python scripts/ticket_mail_worker.py

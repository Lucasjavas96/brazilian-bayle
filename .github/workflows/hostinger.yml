name: Hostinger website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node _local/build.js
      - name: Publish built files to Hostinger branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist "$RUNNER_TEMP/brb-built"
          if git show-ref --verify --quiet refs/remotes/origin/hostinger; then
            git checkout -B hostinger origin/hostinger
          else
            git checkout --orphan hostinger
          fi
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -a "$RUNNER_TEMP/brb-built/." .
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push origin hostinger
      - name: Deploy published branch on Hostinger
        env:
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          url = os.environ['HOSTINGER_DEPLOY_WEBHOOK'].strip()
          if not url:
              raise SystemExit('Hostinger deployment webhook secret is missing')
          payload = {'ref':'refs/heads/hostinger','repository':{'full_name':os.environ['GITHUB_REPOSITORY']}}
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'Content-Type':'application/json','X-GitHub-Event':'push'}, method='POST')
          try:
              with urllib.request.urlopen(request,timeout=90) as response:
                  print('Hostinger deployment trigger HTTP',response.status)
          except urllib.error.HTTPError as error:
              raise SystemExit('Hostinger deployment trigger failed: HTTP '+str(error.code))
          PY
